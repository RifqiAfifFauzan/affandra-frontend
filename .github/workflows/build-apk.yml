name: Build Android APK

on:
  push:
    branches: [ "main" ] # Sesuaikan dengan branch utama git kamu (main / master)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies & Build Frontend
      run: |
        cd affandra-frontend
        npm install
        npm run build

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Debug APK with Gradle
      run: |
        cd affandra-frontend/android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: affandra1.0-apk
        path: affandra-frontend/android/app/build/outputs/apk/debug/app-debug.apk